<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新能源车辆财务报表 · Excel 导出 Demo</title>
    <!-- Tabulator 表格（CDN） -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <style>
      :root {
        --bg: #f3f6f4;
        --ink: #14201a;
        --muted: #5a6b62;
        --line: #d5e0da;
        --accent: #0f7a4c;
        --accent-2: #1a9b63;
        --panel: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 500px at 10% -10%, #d9f2e6 0%, transparent 55%),
          radial-gradient(900px 400px at 100% 0%, #e8f0ff 0%, transparent 50%),
          var(--bg);
      }
      .page {
        padding: 16px 20px 24px;
      }
      .toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .brand h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      .meta {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn.primary {
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
        border-color: transparent;
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(1.05);
        color: #fff;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .msg {
        margin: 0 0 10px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #eaf7f0;
        color: #0f5a38;
        font-size: 13px;
      }
      .hint {
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }
      .grid {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel);
      }
      .tabulator {
        border: none;
        font-size: 13px;
      }
      .tabulator .tabulator-header {
        background: #eef6f1;
        border-bottom: 1px solid var(--line);
      }
      .tabulator .tabulator-col {
        background: #eef6f1;
      }
      .tabulator .tabulator-calcs-bottom {
        background: #fff8e6 !important;
        font-weight: 600;
        border-top: 2px solid #e6b422;
      }
      .tabulator .tabulator-calcs-bottom .tabulator-cell {
        background: #fff8e6 !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hint">正在加载界面…</div>
    </div>

    <!-- Vue 3（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <!-- Tabulator（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <!-- 业务脚本：Vue/Tabulator 用全局变量；excel 导出按需打包 -->
    <script type="module" src="/frontend/main.js"></script>
  </body>
</html>
