<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .router {
            display: none;
        }
    </style>
</head>

<body>
    <div>
        <a href="#/index">首页</a>
        <a href="#/detail">详情</a>
        <a href="#/my">我的</a>
    </div>
    <div class="router" id='index'>
        <h1>首页界面</h1>
        <button id="index1">操作1</button>
        <button id="index2">操作2</button>
        <button id="index3">操作3</button>
    </div>
    <div class="router" id='detail'>
        <h1>详情界面</h1>
        <button id="detail1">操作1</button>
        <button id="detail2">操作2</button>
        <button id="detail3">操作3</button>
    </div>
    <div class="router" id='my'>
        <h1>我的界面</h1>
        <button id="my1">操作1</button>
        <button id="my2">操作2</button>
        <button id="my3">操作3</button>
    </div>

    <script type="module">
        import { getStatisticsInstance } from './StatisticsClass.js'
        // 统计类实例
        let psInstance

        window.onhashchange = (e) => {
            showRouter()
        }

        function getDom(id, str = 'none') {
            let dom = document.getElementById(id)
            dom.style.display = str

        }

        function showRouter() {
            let hash = window.location.hash
            console.log('hash:', hash)
            let hashVal = hash.replace('#/', '')
            let hashValue = hashVal ? hashVal : 'index'
            if (hashValue == 'index') {
                getDom('index', 'inline')
                getDom('detail', 'none')
                getDom('my', 'none')
                psInstance?.startChildProcess(1)
            } else if (hashValue == 'my') {
                getDom('my', 'inline')
                getDom('detail', 'none')
                getDom('index', 'none');
                psInstance?.startChildProcess(2)
            } else if (hashValue == 'detail') {
                getDom('index', 'none')
                getDom('my', 'none')
                getDom('detail', 'inline')
                psInstance?.startChildProcess(3)
            }
        }


        function registerClickFun() {
            const regFun = (domId) => {
                const btnEle = document.getElementById(domId)
                btnEle.addEventListener('click', () => {
                    console.log('点击事件', domId)
                    psInstance.recordPageClickEvent(`点击${domId}`)
                })
            }

            const domIdArr = ['index1', 'index2', 'index3', 'detail1', 'detail2', 'detail3', 'my1', 'my2', 'my3']
            domIdArr.forEach(id => {
                regFun(id)
            })
        }

        // 上报接口
        function reportAddAccessFun(params) {
            console.log('上报接口参数', params)

        }

        // 初始化用户信息
        function initUserInfo() {
            const userInfo = {
                userId: 1,
                userName: '测试用户',
                customerName: '测试客户',
                customerId: 1
            }
            window.localStorage.setItem('gUserInfo', JSON.stringify(userInfo))
        }

        // 初始化hash
        function initHash() {
            window.location.hash = '/'
            setTimeout(() => {
                window.location.hash = '/index';
            });
        }

        function initStaInstance() {
            // 获取用户信息
            const getUserData = () => {
                const userInfoStr = window.localStorage.getItem('gUserInfo')
                const userInfo = JSON.parse(userInfoStr)
                console.log('userInfo', userInfo)
                const commData = {
                    userId: userInfo?.id,
                    userName: userInfo?.userName,
                    customerName: userInfo?.customerName,
                    customerId: userInfo?.customerId,
                }
                return commData
            }

            const commData = getUserData()

            // 初次注册用户信息
            psInstance = getStatisticsInstance({
                source: 1,
                ...commData
            })
            // 用于后续描点记录，实时获取用户信息
            psInstance.addGetCommDataCallback(getUserData)
            // 当页面切换触发，上报所有
            psInstance.on('change', (reportData) => {
                reportAddAccessFun(reportData)
            })
        }

        // 初始化界面
        function initPage() {
            initUserInfo()
            initStaInstance()
            initHash()
            registerClickFun()
        }

        // 结束统计
        function finishStat() {
            psInstance.finishAllProcess()
        }

        // 加入页面进入/离开监听
        function listenPage() {
            document.title = '页面可见';
            document.addEventListener('visibilitychange', function () {
                // 用户离开了当前页面
                if (document.visibilityState === 'hidden') {
                    document.title = '页面不可见';
                    finishStat()
                }

                // 用户打开或回到页面
                if (document.visibilityState === 'visible') {
                    document.title = '页面可见';
                    initHash()
                    psInstance?.resetAPPTime()
                }
            });
        }

        window.onload = function () {
            initPage()
            listenPage()
        }
    </script>
</body>


</html>
