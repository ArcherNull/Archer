<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c测试界面</title>
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
</head>

<body>
    <h1>
        测试界面
    </h1>

    <h1>
        my
    </h1>

    <input type="file" id="image-input" accept="image/*">
    <div id="result"></div>


    <script>
        function main() {
            document.getElementById('image-input').addEventListener('change', async function (e) {
                const file = e.target.files[0];
                console.log('file123123123', file)
                if (file) {
                    const image = new Image();
                    image.src = URL.createObjectURL(file);
                    image.onload = async function () {
                        const { data: { text } } = await Tesseract.recognize(
                            image,
                            'eng', // 使用英语语言包，可以根据需要更换为其他语言包
                            { logger: m => console.log(m) }
                        );
                        console.log('text123123123', text)
                        document.getElementById('result').innerText = text;
                    };
                }
            });
        }

        main()
    </script>

</body>


</html>
